# E3 v2 (NHÁP, chưa chạy): trọng số trộn = configs/train_mix.tsv cuối cùng (16/11/2026): hạ cs_real 0.35 -> 0.20, nâng synth
# 0.05 -> 0.20 (TTS là nguồn duy nhất phủ thuật ngữ tech / edu / finance). Cần pool TTS (dataset/synth) trước khi chạy.
# Thay cho configs/train_mix.tsv (bản cuối: docs/history/train_mix.tsv). Chạy:
#   python -m gipbench.model.run configs/model/experiments/e3_v2.yaml --stages 0-6 [--dry-run] [--set train.lr=0.001]
# Stage: 0 prepare (chép pool / dev từ release, audio tuyệt đối; báo rò rỉ) · 1 curate · 2 tách nhóm + to_lhotse ·
#        3 mix_cuts · 4 finetune (watchdog) · 5 ứng viên: export int8 + decode dev · 6 chọn checkpoint + WiSE-FT ->
#        artifact (onnx + model_card.json) + system yaml cho bench (configs/bench/systems/<system>.yaml)
# Bench KHÔNG nằm trong file này: chạy python -m gipbench.bench.run --system configs/bench/systems/e3_v2.yaml
name: e3_v2
description: "NHÁP: tỉ trọng TTS 0.20, cs_real 0.20; quét MIX_SYNTH=0 / 0.20 / 0.35"
base_model: models/gip15            # model.pt, bpe.model, tokens.txt
catalog: catalog/v0-draft            # trần per-term, chuẩn hoá text, chọn checkpoint (term_acc_macro)
leak_guard: bench/v0-draft           # CHỈ dùng để chặn rò rỉ (to_lhotse --bench, báo cáo stage 0)
dev:
  cs: dev/dev_cs@e3_v1
  vi: dev/dev_vi@e3_v1

# group -> trọng số trong batch (tổng = 1.00), biến môi trường ghi đè (giữ tương thích MIX_*), giá trị `dataset` (tiền tố
# trước ':') thuộc nhóm, và các pool release làm đầu vào. Trọng số = configs/train_mix.tsv cuối cùng (trước refactor, commit 1570a42).
pools:
  cs_real:      {weight: 0.20, env: MIX_CS_REAL, datasets: [ViMedCSS], refs: [pool/vimedcss_train@full],
                 note: "CS thật, nhãn người: ViMedCSS train, dữ liệu tự có. Hạ từ 0.35 (16/11): pool chỉ ~7.5 h nên 0.35 lặp mỗi cut quá nhiều lần và kéo model về y khoa. SEA: tùy chọn, không dùng"}
  cs_pseudo:    {weight: 0.10, env: MIX_CS_PSEUDO, datasets: [vss_cs], refs: [pool/vss_cs@e3_v1],
                 note: "audio thật, nhãn giả: vss_cs (VietSuperSpeech, đã lọc đồng thuận + WER tiếng Việt)"}
  synth:        {weight: 0.20, env: MIX_SYNTH, datasets: [tts], refs: [], note: "CS tổng hợp (TTS đã qua gipbench.dataset.synth.verify). Nâng từ 0.05 (16/11): nguồn duy nhất phủ thuật ngữ tech / edu / finance. Quét MIX_SYNTH=0 / 0.20 / 0.35 để so; phần tiếng Việt (replay + distill + confusable) giữ 0.50"}
  replay_human: {weight: 0.25, env: MIX_REPLAY_HUMAN, datasets: [vivos, commonvoice],
                 refs: [pool/vivos_train@e3_v1, pool/cv_train@v1], note: "Replay tiếng Việt nhãn người (+ call center nếu có)"}
  distill:      {weight: 0.20, env: MIX_DISTILL, datasets: [distill], refs: [pool/distill@e3_v1],
                 note: "Replay tự chưng cất (gipbench.dataset.pseudolabel.distill)"}
  confusable:   {weight: 0.05, env: MIX_CONFUSABLE, datasets: [confusable], refs: [pool/confusable_train@e3_v1],
                 note: "Câu tiếng Việt gần âm thuật ngữ (gipbench.dataset.derive.confusables)"}

curate:                              # tham số gipbench.model.recipe.curate (mặc định của tool cho mục không ghi)
  holdout_domain: [finance]
  max_domain_share: 0.35
  cap_exempt: [other]

features: {speed_perturb: true, phone_sim: 0.3}
mix: {epochs: 6, epoch_hours: 160}

train:
  lr: 0.002
  max_duration: 150
  freeze: "encoder_embed.,encoder.encoders.0.,encoder.encoders.1."
  model_args: "--use-transducer 1 --use-ctc 0"
  drop_ctc: true
  workers: 2
  buckets: 10
  keep_last_k: 40
  segments_per_epoch: 4               # checkpoint mỗi 1/4 epoch ảo (RAM tiến trình chính tăng dần -> chạy theo đoạn)
  watchdog: {disk_path: /mnt/d, min_free_disk_gb: 3, min_ram_mb: 1024, ram_grace_s: 180, hang_s: 600, poll_s: 60}

select: {max_vi_delta: 0.3, wise_alphas: [0.3, 0.5, 0.7, 1.0]}
decode_dev: {threads: 16, batch: 32}

output:
  exp_dir: ${exp_root}/e3_v2        # checkpoint + ứng viên onnx (C: vì D: thiếu chỗ)
  work_dir: data/work/model/e3_v2              # manifest trung gian, lhotse, log
  dev_results: results/e3_v2_dev
  artifact: ${exp_root}/artifacts/e3_v2

systems:                              # system yaml sinh ra ở cuối stage 6
  - {system: e3_v2}
  - {system: e7_v2, hotwords: {catalog: catalog/v0-draft, exclude_b3: true, score: 1.5}}
