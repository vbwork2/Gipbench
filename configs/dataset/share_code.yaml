# Code chấm điểm kèm gói share (package.py --with-code).
# Để ở file cấu hình (không viết trong code) vì tầng dataset không được nhắc tên module gipbench.bench / gipbench.model
# (tests/test_boundaries.py).
#
# roots:     module gốc; package.py tính bao đóng import (AST) từ đây, nên không lệch khi code đổi.
# forbidden: tiền tố module thuộc phần train / dữ liệu train. Bao đóng chứa module nào trong đây thì DỪNG đóng gói.
# skip:      module không kèm dù có trong bao đóng. hf_multilingual (adapter whisper / qwen3, chỉ để chẩn đoán) kéo theo
#            infer/asr_hyps.py và cache.py, có docstring về nguồn dữ liệu nội bộ. Người nhận chấm model khác bằng script
#            tự viết (README mục 4a) hoặc adapter Gipformer / VieGem.
# configs:   file cấu hình chép vào gói (đường dẫn tính từ gốc repo).
# scorer_files: file (tính từ src/gipbench/) mà scorer_code_sha256 băm, theo đúng thứ tự. Phải trùng
#            gipbench.bench.evaluate.SCORER_FILES (tests/dataset/test_package.py kiểm); package ghi hash này vào release.json.
roots:
  - gipbench.bench.evaluate
  - gipbench.bench.transcribe
  - gipbench.dataset.release.fetch
  - gipbench.dataset.release.leak_audit
forbidden:
  - gipbench.model
  - gipbench.dataset.pseudolabel
  - gipbench.dataset.label
  - gipbench.dataset.derive
  - gipbench.dataset.synth
  - gipbench.dataset.report
skip:
  - gipbench.infer.adapters.hf_multilingual
configs:
  - configs/bench/datasets.yaml
  - configs/dataset/labeling/term_decisions.tsv
  - configs/bench/asr_models/gip15_mbs4_open.yaml
  - configs/bench/asr_models/gip15_greedy_open.yaml
  - configs/bench/asr_models/viegem_greedy.yaml
  - configs/bench/asr_models/viegem_lm.yaml
scorer_files:
  - core/textnorm.py
  - core/normprofiles.py
  - core/align.py
  - core/scoring.py
  - core/evalstats.py
  - bench/evaluate.py
