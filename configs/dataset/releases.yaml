# Công thức các data release (hợp đồng dataset -> model / bench). Đăng ký / dựng:
#   python -m gipbench.dataset.release.register --all          # mọi release chưa có
#   python -m gipbench.dataset.release.register pool/vss_cs@e3_v1
# Release là bất biến: muốn đổi nội dung thì thêm mục mới với version mới, không sửa mục cũ đã phát hành.
# Mỗi mục: manifest (hoặc catalog) = file nguồn đã dựng bởi các bước của pipeline dataset (ghi ở `built_by`); release
# chép manifest, đổi audio thành đường dẫn tương đối, ghi sha256 + thống kê vào release.json.
# Đợt đầu (16/11/2026) đăng ký đúng các file mà E3 v1 / v1b và bench nháp v0-draft đã dùng.

releases:
  catalog/v0-draft:
    catalog: data/bench_v0_draft/catalog_v0_draft.tsv
    built_by: gipbench.dataset.release.build_bench --catalog-out (catalog ViMedCSS + span B1/B2 của chính bench)
    flags: {from_bench: true}
    notes: "Có span lấy từ chính bench: hotwords từ catalog này là cận trên lạc quan (STATUS mục 0b)."

  bench/v0-draft:
    manifest: data/bench_v0_draft/bench_v0_draft.jsonl
    catalog: catalog/v0-draft
    built_by: gipbench.dataset.release.build_bench --accept all --version v0-draft (log data/bench_v0_draft/build.log)
    flags: {draft: true, catalog_from_bench: true}
    notes: "Bench NHÁP, chưa duyệt. B1 G-Group, B2 consensus agreed, B3 ViMedCSS hard, B5 G-Group + VIVOS test + consensus product."

  pool/vimedcss_train@full:
    manifest: data/raw/vimedcss_full/train_vimedcss.jsonl
    catalog: catalog/v0-draft
    built_by: gipbench.dataset.ingest.vimedcss --streaming (log data/raw/vimedcss_full/conv.log)
    flags: {label_source: human}
    notes: "ViMedCSS train đầy đủ, 11 832 câu / 22.95 h. CS thật, nhãn người, domain medical."

  pool/vss_cs@e3_v1:
    manifest: data/e3_v1/train_vss_cs.jsonl
    catalog: catalog/v0-draft
    built_by: gipbench.dataset.release.prep_e3_v1 (từ data/raw/vss_full/vss_cs_clean_dom.jsonl, tách dev theo video)
    flags: {train_only: true, label_source: "pseudo:Zipformer-30M-RNNT-6000h"}
    notes: "vss_cs: audio thật VietSuperSpeech, nhãn giả, đã lọc đồng thuận fw large-v3 + qwen3-asr và WER tiếng Việt <= 0.15."

  pool/vivos_train@e3_v1:
    manifest: data/e3_v1/train_vivos.jsonl
    built_by: gipbench.dataset.release.prep_e3_v1 (VIVOS train trừ 4 người nói của dev_vi)
    flags: {label_source: human}

  pool/cv_train@v1:
    manifest: data/raw/cv/train_cv.jsonl
    built_by: gipbench.dataset.ingest.local commonvoice
    flags: {label_source: human}

  pool/distill@e3_v1:
    manifest: data/e3_v1/distill.jsonl
    built_by: gipbench.dataset.pseudolabel.distill (VSS không có từ Anh, greedy = beam của Gipformer 1.5)
    flags: {label_source: "distill:gip15"}

  pool/confusable_train@e3_v1:
    manifest: data/e3_v1/train_confusable.jsonl
    built_by: gipbench.dataset.derive.confusables, rồi prep_e3_v1 bỏ người nói của dev_vi
    flags: {label_source: "pseudo:Zipformer-30M-RNNT-6000h"}

  # --- pool v2 (17/11/2026, TODO 2c / audit IP-06): sạch với mọi bench khoá; mục cũ giữ nguyên làm lịch sử ---
  pool/vimedcss_train@v2:
    manifest: data/pools/vimedcss_train_v2/manifest.jsonl
    catalog: catalog/vimedcss-v1.0
    built_by: gipbench.dataset.release.clean_pool --pool pool/vimedcss_train@full (báo cáo cạnh manifest)
    flags: {label_source: human, clean_against: locked_benches, parent: pool/vimedcss_train@full}
    notes: "ViMedCSS train bỏ MỌI video có trong bench khoá (C0 + E0 ViMedCSS test, theo source_key) và câu trùng text:
      3 945 câu / 7.64 h / 1 219 video (từ 11 832 / 22.95 h). Chưa loại video của dev_v2 (chưa có): dựng dev_v2 xong thì
      chạy lại clean_pool --exclude <dev_v2> ra version mới."

  pool/cv_other@v2:
    manifest: data/pools/cv_other_v2/manifest.jsonl
    built_by: gipbench.dataset.ingest.local commonvoice_pool (CV27 validated + other, trừ client_id test / dev, trần 30 câu / người
      nói), rồi gipbench.dataset.release.clean_pool
    flags: {label_source: "human_prompt:cv27 (phần lớn chưa có phiếu xác nhận)", clean_against: locked_benches}
    notes: "Thay cv_train@v1 (1 người nói). CV27 validated trừ người nói test / dev chỉ còn đúng 1 người nói, nên lấy thêm
      other.tsv (down_votes = 0). 859 câu / 1.04 h / 170 người nói; bỏ 170 câu có câu nhắc trùng CV17 test (E0). Nhãn = câu
      nhắc, đa số câu chưa có phiếu xác nhận: dùng trọng số thấp, hoặc bỏ nếu X0 cho thấy hại."

  pool/confusable_train@e3_v1b:
    manifest: data/e3_v1/train_confusable.jsonl
    built_by: gipbench.dataset.derive.confusables, rồi prep_e3_v1 bỏ người nói của dev_vi (cùng file với @e3_v1)
    flags: {label_source: "human:vivos_train", audio_duplicate_of: pool/vivos_train@e3_v1, errata_for: pool/confusable_train@e3_v1}
    notes: "Đính chính @e3_v1: nhãn là nhãn người của VIVOS train, không phải nhãn giả. 590 / 590 câu cùng audio với
      vivos_train@e3_v1: curate (dedupe audio, mặc định bật) chỉ giữ một bản; dùng như trọng số lấy mẫu, không phải dữ liệu mới."

  pool/vivos_train@v2:
    manifest: data/pools/vivos_train_v2/manifest.jsonl
    built_by: gipbench.dataset.release.clean_pool --pool pool/vivos_train@e3_v1
    flags: {label_source: human, clean_against: locked_benches, parent: pool/vivos_train@e3_v1}
    notes: "vivos_train@e3_v1 bỏ 2 câu trùng text với G0 / E0 ngoài luật bộ đọc ('cà phê', 'khải huyền'): 10 557 câu, 42 người nói.
      Trùng câu chữ VIVOS train / test trong cùng bộ đọc vẫn còn (review, báo lát text_unseen), không phải critical."

  pool/confusable_train@v2:
    manifest: data/pools/confusable_train_v2/manifest.jsonl
    built_by: gipbench.dataset.release.clean_pool --pool pool/confusable_train@e3_v1b
    flags: {label_source: "human:vivos_train", audio_duplicate_of: pool/vivos_train@v2, clean_against: locked_benches,
            parent: pool/confusable_train@e3_v1b}
    notes: "e3_v1b bỏ 4 câu trùng text với G0 (domain confusable không được luật bộ đọc miễn): 586 câu. Vẫn trùng audio
      100% với vivos_train: curate dedupe chỉ giữ một bản."

  dev/dev_cs@e3_v1:
    manifest: data/e3_v1/dev_cs.jsonl
    catalog: catalog/v0-draft
    built_by: gipbench.dataset.release.build_dev_cs (600 câu ViMedCSS validation + vss_cs held-out, bỏ câu < 0.5 s)
    notes: "Dev cũ: trùng người nói (video) với train, 87% y khoa (xem docstring make_dev_split)."

  dev/dev_vi@e3_v1:
    manifest: data/e3_v1/dev_vi.jsonl
    built_by: gipbench.dataset.release.prep_e3_v1 (VIVOS train, 4 người nói held-out, 0.96 h)

  # --- bench v1 (ASR tổng quát, 17/11/2026): cùng manifest với configs/bench/benchmarks/*_v1.yaml (đã khoá sha256) ---
  catalog/vimedcss-v1.0:
    catalog: data/raw/vimedcss_hard/catalog_vimedcss.tsv
    built_by: gipbench.dataset.ingest.vimedcss (split hard; thuật ngữ theo cs_terms_list của dataset)
    flags: {from_bench: false}
    notes: "Catalog chấm C0 (= catalog_sha256 a21c590e của code_switch_v1)."

  # catalog/train-v1 (18/11/2026): thuật ngữ <en> của text train, trừ span mọi bench khoá và reserved_terms_v1 (chốt 18/11, fraction 0.5).
  catalog/train-v1:
    catalog: data/catalogs/train_v1/catalog.tsv
    built_by: >-
      gipbench.dataset.release.build_train_catalog --source pool/vimedcss_train@v2:text_tagged_orig
      --source pool/vss_cs@e3_v1:text_tagged --reserved-terms configs/dataset/reserved_terms_v1.txt
      (meta: data/catalogs/train_v1/catalog.tsv.meta.json)
    flags: {from_bench: false}
    notes: "727 thuật ngữ. Không chứa span của 6 bench khoá và 820 thuật ngữ giữ riêng (reserved_terms_v1.txt, sha256 trong meta)."

  bench/general-v1.0:
    manifest: data/benchmarks/general_v1/manifest.jsonl
    built_by: gipbench.dataset.release.build_general --which general --name general_v1 --bench-version general-v1.0
    flags: {locked: true, manifest_sha256: e908c75a3f23c949b2ae0f2b82d6ec98e75eca1204f07dd44a50139e352c3dcb}
    notes: "G0: VIVOS, Common Voice 27, G-Group x4 test (4 400 câu). Chấm bằng bench.evaluate --benchmark general_v1."

  bench/code-switch-v1.0:
    manifest: data/benchmarks/code_switch_v1/manifest.jsonl
    catalog: catalog/vimedcss-v1.0
    built_by: gipbench.dataset.release.build_general --which code_switch --name code_switch_v1 --bench-version code-switch-v1.0
    flags: {locked: true, manifest_sha256: 744d4773d4a0f01161f7ff5694b8a8e3466f93efaff91ebb74750e70388dc06a}
    notes: "C0: ViMedCSS hard (658 câu)."

  bench/cs-ggroup-v1.0:
    manifest: data/benchmarks/cs_ggroup_v1/manifest.jsonl
    built_by: gipbench.dataset.release.build_general --which cs_ggroup --name cs_ggroup_v1 --bench-version cs-ggroup-v1.0
    flags: {locked: true, manifest_sha256: e3c3cc1b91027fefc529dbfe2bb23d1b52b0948899d17af0b1cbcb9edac496af}
    notes: "C1: câu G-Group test có từ Anh (1 260 câu), cùng audio với G0."

  bench/external-v1.0:
    manifest: data/benchmarks/external_v1/manifest.jsonl
    built_by: gipbench.dataset.release.build_general --which external --name external_v1 --bench-version external-v1.0
    flags: {locked: true, manifest_sha256: f074d27fb646d2fb376eca1189b3fb05374860276c1463657286d35c26e0a1dd}
    notes: "E0: 11 bộ test công khai (32 203 câu); 7 bộ khoá bằng metadata (chưa có audio cho tới khi tải)."

  # --- bench v1.1 (17/11/2026, audit IP-07): bản mới, v1.0 giữ nguyên. Khoá 18/11/2026 ---
  bench/code-switch-v1.1:
    manifest: data/benchmarks/code_switch_v1_1/manifest.jsonl
    catalog: catalog/vimedcss-v1.0
    built_by: gipbench.dataset.release.derive_v1_1 --which code_switch
    flags: {locked: true, derived_from: bench/code-switch-v1.0, manifest_sha256: 3af637ffa603b0259268c98ec4432ff56d23d16f014cc575d90a347199d079ba}
    notes: "C0 + train_video_overlap (388 câu / 248 video trùng ViMedCSS train; lát video_unseen 270 câu / 156 video)."

  bench/external-v1.1:
    manifest: data/benchmarks/external_v1_1/manifest.jsonl
    built_by: gipbench.dataset.release.derive_v1_1 --which external
    flags: {locked: true, derived_from: bench/external-v1.0, manifest_sha256: 2960680ca6b8476ec73b20f0c8c9295e617e7e0a3533a949afb1a2cae9c26be3}
    notes: "E0 + audio_sha256 / duration đủ 32 203 câu (dựng lại 17/11 21:31 sau khi ViMD tải xong), speaker ViMedCSS test chuẩn hoá, train_video_overlap."

# Đính chính cho release đã phát hành (release bất biến: không sửa mục cũ, chỉ trỏ tới mục thay thế). register.py không đọc
# khoá này; nó là ghi chép cho người và cho các experiment mới.
errata:
  pool/confusable_train@e3_v1:
    date: 2026-11-17
    issue: "flags.label_source ghi nhầm là nhãn giả; thực tế là nhãn người VIVOS train, và 590 / 590 câu trùng audio với vivos_train@e3_v1"
    use_instead: pool/confusable_train@e3_v1b
  pool/cv_train@v1:
    date: 2026-11-17
    issue: "chỉ 1 người nói (CV27 train.tsv): replay không đa dạng (audit R15)"
    use_instead: pool/cv_other@v2
  pool/vimedcss_train@full:
    date: 2026-11-17
    issue: "chung video với bench khoá (C0 388 câu / 248 video, E0 ViMedCSS test 1 514 câu / 898 video): cổng rò rỉ chặn"
    use_instead: pool/vimedcss_train@v2
