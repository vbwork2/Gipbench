# DIAGNOSTIC PRESET, not a benchmark system. Do not run it on gipbench benchmarks or point
# configs/bench at it. The four names came from FPT development recordings, and one of them
# (SMITH) also occurs in benchmark text. The bench leak gate only checks catalog-derived
# hotwords, so `provenance: external` here would not stop that run. Used by
# scripts/diagnostics/fpt_targeted_names.py on the sealed FPT development splits.
system: gip15_mbs4_fpt_reviewed_names
engine: sherpa_transducer
model:
  id: g-group-ai-lab/gipformer1.5-68M-rnnt
  revision: dd9227dcd8705c13f33bdbe59728d546ab94480f
  dir: "${models_root}/gip15"
inference_mode: context_bias
context_vocab:
  file: "${repo}/configs/diagnostics/fpt/fpt_reviewed_names.txt"
  score: 3.0
  provenance: external
decode:
  quantize: int8
  decoding_method: modified_beam_search
  beam: 4
  threads: 4
  blank_penalty: 0.0
  case: upper
batch: 1
