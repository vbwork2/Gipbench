# = E1 hw1.5: hotwords từ catalog v0-draft, catalog này chứa 1 618 span lấy từ CHÍNH bench -> oracle_bias.
# Chỉ là cận trên chẩn đoán; KHÔNG xếp hạng zero-shot / open-vocabulary. Không chạy được trên G0 (bị chặn).
system: gip15_mbs4_hw1.5_oracle
engine: sherpa_transducer
model: {id: g-group-ai-lab/gipformer1.5-68M-rnnt, revision: dd9227dcd8705c13f33bdbe59728d546ab94480f,
        dir: "${models_root}/gip15"}
inference_mode: oracle_bias
context_vocab: {catalog: "${data_root}/bench_v0_draft/catalog_v0_draft.tsv", exclude_b3: true, score: 1.5,
                provenance: test_derived}
decode: {quantize: int8, decoding_method: modified_beam_search, beam: 4, threads: 16, blank_penalty: 0.0, case: upper}
# batch 1: kết quả không phụ thuộc câu nào nằm cùng lô. sherpa-onnx giải mã theo lô cho hyp khác nhau khi đổi
# thành phần lô (đo 16/11/2026: lô 1 vs lô 32 khác 30/140 câu). E0 lịch sử dùng lô 32 theo thứ tự manifest v0-draft.
batch: 1
