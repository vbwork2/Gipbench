# VieGem-ASR + KenLM 4-gram đi kèm model (train trên transcript train của VieGem theo model card). Cần `pip install kenlm`.
system: viegem_lm
engine: viegem
model: {id: 5CD-AI/VieGem-ASR, revision: 95eae70b21fb0ef640e3ac4ea8cfa2380872ed20,
        dir: "${models_root}/viegem", encoder_dir: "${models_root}/embeddinggemma-2"}
inference_mode: lm
decode: {method: lm, alpha: 0.35, beta: 1.5, beam_width: 32, device: auto, max_chunk_sec: 30}
batch: 8
