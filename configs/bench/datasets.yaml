# Registry nguồn dữ liệu đánh giá. Đọc bằng gipbench.bench.registry (kiểm trường bắt buộc + giá trị hợp lệ).
# Mọi id / revision / license / số câu dưới đây đã kiểm qua Hugging Face API ngày 2026-11-16 (không đoán);
# trường nào chưa kiểm được ghi "unknown". Đổi nội dung = tăng `registry_version`.
#
# pretraining_overlap (theo từng model, so với model card công bố):
#   confirmed       : model card ghi đã train trên CHÍNH split này
#   known_possible  : model card ghi train trên split khác của cùng bộ, hoặc cùng tổ chức phát hành cả model lẫn test;
#                     không coi là zero-shot độc lập
#   not_listed      : model card có liệt kê dữ liệu train và không có bộ này (KHÔNG phải bằng chứng là sạch)
#   unknown         : model card không công bố dữ liệu train
registry_version: 1
verified_on: "2026-11-16"
models:
  gipformer15: {hf_id: g-group-ai-lab/gipformer1.5-68M-rnnt, revision: dd9227dcd8705c13f33bdbe59728d546ab94480f,
                license: MIT, training_data_disclosed: false}
  viegem: {hf_id: 5CD-AI/VieGem-ASR, revision: 95eae70b21fb0ef640e3ac4ea8cfa2380872ed20,
