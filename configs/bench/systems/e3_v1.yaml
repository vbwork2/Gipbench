# E3 v1: FT, chọn wise_1 trên dev (results/e3_v1_dev/select_wise.json). Tham số = config trong results/v0_draft/e3_v1/decode_summary.json (lần chạy gốc).
# Chạy: python -m gipbench.bench.run --bench bench/v0-draft --system configs/bench/systems/e3_v1.yaml
system: e3_v1
model: ${exp_root}/e3_v1/cand/wise_1/onnx
decode:
  decoding_method: modified_beam_search
  beam: 4
  quantize: int8
  threads: 16
  batch: 32
  blank_penalty: 0.0
  case: upper
