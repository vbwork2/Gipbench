# Gipformer 1.5 gốc, không hotwords (E0). Tham số = config trong results/v0_draft/e0_baseline/decode_summary.json (lần chạy gốc).
# Chạy: python -m gipbench.bench.run --bench bench/v0-draft --system configs/bench/systems/e0_baseline.yaml
system: e0_baseline
model: models/gip15
decode:
  decoding_method: modified_beam_search
  beam: 4
  quantize: int8
  threads: 16
  batch: 32
  blank_penalty: 0.0
  case: upper
