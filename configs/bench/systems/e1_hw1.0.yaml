# Gipformer 1.5 + hotwords từ catalog, score 1.0 (E1). Tham số = config trong results/v0_draft/e1_hw1.0/decode_summary.json (lần chạy gốc).
# Chạy: python -m gipbench.bench.run --bench bench/v0-draft --system configs/bench/systems/e1_hw1.0.yaml
system: e1_hw1.0
model: models/gip15
decode:
  decoding_method: modified_beam_search
  beam: 4
  quantize: int8
  threads: 16
  batch: 32
  blank_penalty: 0.0
  case: upper
  hotwords_catalog: catalog/v0-draft      # release; cùng nội dung data/bench_v0_draft/catalog_v0_draft.tsv
  hotwords_exclude_b3: true
  hotwords_score: 1.0
