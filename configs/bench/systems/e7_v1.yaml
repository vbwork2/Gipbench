# E7 v1 = E3 v1 + hotwords 1.5. Tham số = config trong results/v0_draft/e7_v1/decode_summary.json (lần chạy gốc).
# Chạy: python -m gipbench.bench.run --bench bench/v0-draft --system configs/bench/systems/e7_v1.yaml
system: e7_v1
model: ${exp_root}/e3_v1/cand/wise_1/onnx
decode:
  decoding_method: modified_beam_search
  beam: 4
  quantize: int8
  threads: 16
  batch: 32
  blank_penalty: 0.0
  case: upper
  hotwords_catalog: catalog/v0-draft      # release; cùng nội dung data/bench_v0_draft/catalog_v0_draft.tsv
  hotwords_exclude_b3: true
  hotwords_score: 1.5
