# FT thử A4 (194 step), bị loại vì quên tiếng Việt. Tham số = config trong results/v0_draft/a4_trial/decode_summary.json (lần chạy gốc).
# Chạy: python -m gipbench.bench.run --bench bench/v0-draft --system configs/bench/systems/a4_trial.yaml
system: a4_trial
model: exp/a4_trial/onnx
decode:
  decoding_method: modified_beam_search
  beam: 4
  quantize: int8
  threads: 16
  batch: 32
  blank_penalty: 0.0
  case: upper
