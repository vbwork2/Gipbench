# E0 External: các bộ test công khai mà model card / bài báo khác đã báo số (vd bảng của model card VieGem-ASR), để so
# với số đã công bố và mở rộng phạm vi ngoài G0 / C0 / C1.
# Dựng bằng: python -m gipbench.dataset.ingest.evalsets --sets <bộ...>  rồi  build_general --which external
benchmark_id: external
version: v1-draft
track: E0
purpose: >-
  Đo trên split test chính thức của các bộ công khai khác (FLEURS vi, Common Voice 17 vi, VietMed, LSVSC, ViMD,
  Speech-MASSIVE vi dev, ViMedCSS test), lời thoại gốc của bên phát hành, báo theo từng bộ. Nhiều bộ trùng nguồn với
  dữ liệu train của VieGem (pretraining_overlap); VietMed và Speech-MASSIVE không có trong danh sách train của VieGem.
  Số so với model card chỉ xấp xỉ: mỗi bên chuẩn hoá text khác nhau.
evidence_level: draft
status: active
manifest: ${data_root}/benchmarks/external_v1_draft/manifest.jsonl
manifest_sha256: null
catalog: null
profile: gipbench_strict_v1
also_report_profiles: [legacy_v0]
primary_metric: wer
group_by: [dataset, domain, gender]
aggregate: macro_by_dataset
boot_unit: speaker             # bộ không có id người nói (LSVSC, FLEURS): speaker = id câu
seed: 0
iters: 1000
allowed_inference_modes: [open_vocab, lm]
sources:
  - {dataset: fleurs_vi, split: test, slice: read_wiki}
  - {dataset: cv17_vi, split: test, slice: read_crowd}
  - {dataset: vietmed, split: test, slice: medical_conversation}
  - {dataset: lsvsc, split: test, slice: mixed}
  - {dataset: vimd, split: test, slice: dialect}
  - {dataset: speech_massive_vi, split: validation, slice: voice_assistant}
  - {dataset: vimedcss_test, split: test, slice: medical_cs}
