<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duyệt bench</title>
<!--
  Công cụ duyệt phiếu *_review.csv của converter (gipbench). Mở trực tiếp bằng trình duyệt, KHÔNG cần server/mạng
  (trừ khi audio là link HF). Xuất CSV đúng định dạng converters/build_bench_v0.py đọc:
  decision (ok/fix/drop), text_tagged_fixed, viet_levels, reading_note, region, gender, note — các cột khác giữ nguyên.
  Phím tắt: 1 = ok, 2 = drop, 3 = fix (sửa text_tagged; Enter lưu, Esc huỷ), Space = phát/dừng, R = phát lại,
  ← / → = câu trước / sau, S / M / N = thêm mức Việt hoá strong / mid / native, Backspace = xoá mức cuối,
  U = bỏ quyết định, Ctrl+S = xuất CSV. Sau 1 / 2 / lưu fix: tự sang câu chưa duyệt kế tiếp và phát audio.
  Tiến độ được lưu tạm trong trình duyệt (localStorage) theo tên file; vẫn phải bấm "Xuất CSV" để có file.
-->
<style>
:root { --bg:#f7f7f5; --fg:#1d1d1b; --mut:#6b6b66; --card:#fff; --line:#dcdcd6; --en:#0b57d0; --enbg:#e8f0fe;
        --ok:#1e7d32; --drop:#b3261e; --fix:#8a5a00; --warn:#fff4d6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#161615; --fg:#ececea; --mut:#a3a39d;
        --card:#212120; --line:#3a3a37; --en:#8ab4f8; --enbg:#1f2a3d; --ok:#6dd58c; --drop:#f2b8b5; --fix:#ffd27a; --warn:#3b3220; } }
:root[data-theme="dark"] { --bg:#161615; --fg:#ececea; --mut:#a3a39d; --card:#212120; --line:#3a3a37; --en:#8ab4f8;
        --enbg:#1f2a3d; --ok:#6dd58c; --drop:#f2b8b5; --fix:#ffd27a; --warn:#3b3220; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); }
header h1 { font-size:16px; margin:0 8px 0 0; }
label.btn, button { border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:6px; padding:5px 10px;
        font:inherit; cursor:pointer; }
input[type=file] { display:none; }
main { display:grid; grid-template-columns:minmax(0,1fr) 260px; gap:16px; padding:16px; max-width:1200px; margin:0 auto; }
@media (max-width:820px) { main { grid-template-columns:1fr; } #list { max-height:240px; } }
.card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; }
.meta { color:var(--mut); font-size:13px; display:flex; flex-wrap:wrap; gap:4px 14px; }
.text { font-size:21px; line-height:1.6; margin:12px 0; word-wrap:break-word; }
.text b.en { color:var(--en); background:var(--enbg); border-radius:4px; padding:0 3px; font-weight:700; }
.orig { color:var(--mut); font-size:14px; }
.flags span { background:var(--warn); border-radius:4px; padding:1px 6px; margin-right:6px; font-size:13px; }
audio { width:100%; margin:8px 0; }
.dec { font-weight:700; text-transform:uppercase; }
.dec.ok { color:var(--ok); } .dec.drop { color:var(--drop); } .dec.fix { color:var(--fix); }
.row { display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; align-items:center; }
.row input, .row select, textarea { font:inherit; background:var(--bg); color:var(--fg); border:1px solid var(--line);
        border-radius:6px; padding:4px 8px; }
textarea { width:100%; min-height:70px; font-size:17px; }
#fixbox { display:none; margin-top:10px; }
#fixerr { color:var(--drop); font-size:13px; min-height:1.2em; }
#list { max-height:70vh; overflow:auto; font-size:13px; padding:6px; }
#list div { padding:3px 6px; border-radius:4px; cursor:pointer; display:flex; justify-content:space-between; gap:6px; }
#list div.cur { outline:2px solid var(--en); }
#list div span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.keys { color:var(--mut); font-size:13px; margin-top:12px; }
.keys kbd { border:1px solid var(--line); border-radius:4px; padding:0 5px; background:var(--bg); }
.bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; flex:1 1 120px; min-width:120px; }
.bar i { display:block; height:100%; background:var(--ok); width:0; }
#empty { color:var(--mut); }
</style>
</head>
<body>
<header>
  <h1>Duyệt bench</h1>
  <label class="btn">Mở CSV phiếu duyệt<input id="csvIn" type="file" accept=".csv,text/csv"></label>
  <label class="btn">Chọn thư mục audio<input id="dirIn" type="file" webkitdirectory multiple></label>
  <input id="urlPrefix" placeholder="URL gốc audio (tuỳ chọn, vd link HF …/resolve/main/)" size="38">
  <select id="rate" title="tốc độ phát"><option>1</option><option>1.25</option><option>1.5</option><option>1.75</option></select>
  <button id="exportBtn">Xuất CSV</button>
  <div class="bar"><i id="barFill"></i></div>
  <span id="stat" class="meta"></span>
</header>
<main>
  <section class="card" id="view">
    <p id="empty">Mở file <code>*_review.csv</code> do converter xuất (vd <code>data/raw/ggroup/b1_candidates_review.csv</code>),
      rồi chọn thư mục chứa audio (thư mục của CSV, vd <code>data/raw/ggroup</code>). Audio là link http(s) thì phát thẳng.</p>
  </section>
  <aside class="card" id="list"></aside>
</main>

<script id="core">
// ---- lõi thuần (không DOM): đọc/ghi CSV, kiểm tag, áp quyết định. Test chạy phần này bằng Node.
const OUT_COLS = ["decision", "text_tagged_fixed", "viet_levels", "reading_note", "region", "gender", "note"];

function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const out = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n") { row.push(f); out.push(row); row = []; f = ""; }
    else if (c !== "\r") f += c;
  }
  if (f !== "" || row.length) { row.push(f); out.push(row); }
  const header = out.shift() || [];
  const rows = out.filter(r => r.length > 1 || r[0] !== "").map(r => {
    const o = {}; header.forEach((h, k) => { o[h] = r[k] === undefined ? "" : r[k]; }); return o;
  });
  return { header, rows };
}

function csvField(v) {
  v = v == null ? "" : String(v);
  return /[",\r\n]/.test(v) || /^\s|\s$/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}

function ensureCols(header) {
  const h = header.slice();
  for (const c of OUT_COLS) if (!h.includes(c)) h.push(c);
  return h;
}

function toCSV(header, rows) {
  const lines = [header.map(csvField).join(",")];
  for (const r of rows) lines.push(header.map(h => csvField(r[h])).join(","));
  return "﻿" + lines.join("\r\n") + "\r\n";
}

// giống lib.textnorm.tagged_well_formed (build_bench_v0 loại câu fix có tag hỏng)
function tagError(t) {
  const opens = (t.match(/<en(?:\s[^>]*)?>/g) || []).length, closes = (t.match(/<\/en>/g) || []).length;
  if (opens !== closes) return `số <en> (${opens}) khác số </en> (${closes})`;
  if (/<en(?:\s[^>]*)?>[^<]*<en/.test(t)) return "tag <en> lồng nhau";
  if (/<en(?:\s[^>]*)?>\s*<\/en>/.test(t)) return "span <en> rỗng";
  if (/[<>]/.test(t.replace(/<\/?en(?:\s[^>]*)?>/g, ""))) return "còn ký tự < > lạ";
  return "";
}

function countSpans(t) { return (String(t || "").match(/<en(?:\s[^>]*)?>/g) || []).length; }

// rev: {decision, fixed, viet_levels, reading_note, region, gender, note}; trường nào không có thì giữ giá trị cũ của dòng
function applyReview(row, rev) {
  const o = Object.assign({}, row);
  if (!rev) return o;
  if (rev.decision !== undefined) o.decision = rev.decision;
  if (rev.fixed !== undefined) o.text_tagged_fixed = rev.decision === "fix" ? rev.fixed : (rev.fixed || "");
  for (const k of ["viet_levels", "reading_note", "region", "gender", "note"]) if (rev[k] !== undefined) o[k] = rev[k];
  return o;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function tagHtml(t) {  // span <en> tô đậm, phần còn lại escape
  const parts = String(t || "").split(/(<en(?:\s[^>]*)?>[\s\S]*?<\/en>)/);
  return parts.map(p => {
    const m = p.match(/^<en(?:\s[^>]*)?>([\s\S]*?)<\/en>$/);
    return m ? `<b class="en">${escapeHtml(m[1])}</b>` : escapeHtml(p);
  }).join("");
}

if (typeof module !== "undefined") module.exports = { OUT_COLS, parseCSV, toCSV, ensureCols, tagError, applyReview, tagHtml, countSpans };
</script>

<script>
// ---- giao diện
const $ = id => document.getElementById(id);
const S = { name: "", header: [], rows: [], rev: {}, i: 0, files: new Map(), url: null, shownAt: 0, times: [] };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* trình duyệt chặn lưu: bỏ qua */ } },
};
const key = () => `gipbench-review:${S.name}:${S.rows.length}`;
const decOf = r => (S.rev[r.id] && S.rev[r.id].decision !== undefined ? S.rev[r.id].decision : r.decision || "").trim().toLowerCase();
const field = (r, k, col) => (S.rev[r.id] && S.rev[r.id][k] !== undefined ? S.rev[r.id][k] : r[col || k] || "");

$("rate").value = String(store.get("gipbench-review:rate", "1"));
$("urlPrefix").value = store.get("gipbench-review:urlPrefix", "");
$("rate").onchange = () => { store.set("gipbench-review:rate", $("rate").value); const a = $("aud"); if (a) a.playbackRate = +$("rate").value; };
$("urlPrefix").onchange = () => { store.set("gipbench-review:urlPrefix", $("urlPrefix").value.trim()); render(true); };

$("csvIn").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const { header, rows } = parseCSV(await f.text());
  if (!header.includes("id")) { alertBox("CSV không có cột id"); return; }
  Object.assign(S, { name: f.name, header: ensureCols(header), rows, i: 0, times: [] });
  S.rev = store.get(key(), {});
  const first = rows.findIndex(r => !decOf(r));
  S.i = first < 0 ? 0 : first;
  buildList(); render(true);
};
$("dirIn").onchange = e => {
  S.files.clear();
  for (const f of e.target.files) {
    const parts = (f.webkitRelativePath || f.name).split("/");
    for (let k = 0; k < parts.length; k++) S.files.set(parts.slice(k).join("/"), f);  // khớp theo mọi hậu tố đường dẫn
  }
  render(true);
};
$("exportBtn").onclick = exportCSV;

function alertBox(msg) { $("view").insertAdjacentHTML("afterbegin", `<p class="flags"><span>${escapeHtml(msg)}</span></p>`); }

function audioSrc(r) {
  const a = String(r.audio || "").replace(/^\.\//, "");
  if (/^https?:\/\//i.test(a)) return a;
  const f = S.files.get(a) || S.files.get(a.split("/").pop());
  if (f) { if (S.url) URL.revokeObjectURL(S.url); S.url = URL.createObjectURL(f); return S.url; }
  const pre = $("urlPrefix").value.trim();
  return pre ? pre + a : "";
}

function buildList() {
  $("list").innerHTML = S.rows.map((r, k) => `<div data-k="${k}"><span>${escapeHtml(r.id)}</span><span class="dec ${decOf(r)}">${decOf(r) || "·"}</span></div>`).join("");
  $("list").onclick = e => { const d = e.target.closest("div[data-k]"); if (d) { S.i = +d.dataset.k; render(true); } };
}

function updateStats() {
  const c = { ok: 0, drop: 0, fix: 0 };
  S.rows.forEach(r => { const d = decOf(r); if (c[d] !== undefined) c[d]++; });
  const done = c.ok + c.drop + c.fix, n = S.rows.length;
  const avg = S.times.length ? (S.times.reduce((a, b) => a + b, 0) / S.times.length).toFixed(1) : "–";
  $("barFill").style.width = n ? (100 * done / n) + "%" : 0;
  $("stat").textContent = `${done}/${n} câu · ok ${c.ok} · fix ${c.fix} · drop ${c.drop} · TB ${avg} s/câu (phiên này)`;
  const items = $("list").children;
  S.rows.forEach((r, k) => { if (items[k]) { items[k].classList.toggle("cur", k === S.i);
    const s = items[k].lastChild; s.className = "dec " + decOf(r); s.textContent = decOf(r) || "·"; } });
  const cur = items[S.i]; if (cur) cur.scrollIntoView({ block: "nearest" });
}

function render(play) {
  if (!S.rows.length) return;
  const r = S.rows[S.i], src = audioSrc(r), d = decOf(r);
  const tagged = d === "fix" ? field(r, "fixed", "text_tagged_fixed") || r.text_tagged : r.text_tagged;
  const flags = String(r.flags || "").split(/[;|]/).map(x => x.trim()).filter(Boolean);
  const nsp = countSpans(tagged), lv = field(r, "viet_levels").split(",").map(x => x.trim()).filter(Boolean);
  $("view").innerHTML = `
    <div class="meta"><b>${escapeHtml(r.id)}</b><span>${escapeHtml(r.split || "")}</span><span>${escapeHtml(r.duration || "")} s</span>
      <span>confidence: ${escapeHtml(r.confidence || "–")}</span><span>câu ${S.i + 1}/${S.rows.length}</span>
      <span class="dec ${d}">${d || "chưa duyệt"}</span></div>
    ${src ? `<audio id="aud" controls preload="auto" src="${escapeHtml(src)}"></audio>`
          : `<p class="flags"><span>Chưa có audio: chọn thư mục audio hoặc nhập URL gốc (${escapeHtml(r.audio || "")})</span></p>`}
    <div class="text">${tagHtml(tagged)}</div>
    ${r.text_tagged_orig && r.text_tagged_orig !== r.text_tagged ? `<div class="orig">nhãn gốc dataset: ${tagHtml(r.text_tagged_orig)}</div>` : ""}
    ${d === "fix" ? `<div class="orig">nhãn máy: ${tagHtml(r.text_tagged)}</div>` : ""}
    <div class="flags">${flags.map(f => `<span>${escapeHtml(f)}</span>`).join("")}</div>
    <div id="fixbox"><textarea id="fixText"></textarea><div id="fixerr"></div>
      <button id="fixSave">Lưu fix (Enter)</button> <button id="fixCancel">Huỷ (Esc)</button></div>
    <div class="row">
      <label>viet_levels (<span id="lvc">${lv.length}</span>/${nsp} span) <input id="fLv" size="22" value="${escapeHtml(lv.join(","))}"></label>
      <label>region <select id="fRegion">${["", "north", "central", "south", "other", "unk"].map(v =>
        `<option ${field(r, "region") === v ? "selected" : ""}>${v}</option>`).join("")}</select></label>
      <label>gender <select id="fGender">${["", "f", "m", "u"].map(v =>
        `<option ${field(r, "gender") === v ? "selected" : ""}>${v}</option>`).join("")}</select></label>
    </div>
    <div class="row"><label style="flex:1">reading_note <input id="fRead" style="width:100%" value="${escapeHtml(field(r, "reading_note"))}"></label></div>
    <div class="row"><label style="flex:1">note <input id="fNote" style="width:100%" value="${escapeHtml(field(r, "note"))}"></label></div>
    <div class="keys"><kbd>1</kbd> ok · <kbd>2</kbd> drop · <kbd>3</kbd> fix · <kbd>Space</kbd> phát/dừng · <kbd>R</kbd> phát lại ·
      <kbd>←</kbd>/<kbd>→</kbd> câu trước/sau · <kbd>S</kbd>/<kbd>M</kbd>/<kbd>N</kbd> mức Việt hoá · <kbd>U</kbd> bỏ quyết định ·
      <kbd>Ctrl+S</kbd> xuất CSV</div>`;
  const bind = (id, k) => { $(id).onchange = () => setRev(r, { [k]: $(id).value.trim() }); };
  bind("fLv", "viet_levels"); bind("fRegion", "region"); bind("fGender", "gender"); bind("fRead", "reading_note"); bind("fNote", "note");
  $("fixSave").onclick = saveFix; $("fixCancel").onclick = () => { $("fixbox").style.display = "none"; };
  const a = $("aud");
  if (a) { a.playbackRate = +$("rate").value; if (play) a.play().catch(() => {}); }
  S.shownAt = performance.now();
  updateStats();
}

function setRev(r, patch) {
  S.rev[r.id] = Object.assign({}, S.rev[r.id] || {}, patch);
  store.set(key(), S.rev);
}

function decide(dec, patch) {
  const r = S.rows[S.i];
  setRev(r, Object.assign({ decision: dec }, patch || {}));
  S.times.push((performance.now() - S.shownAt) / 1000);
  next(true);
}

function next(undecidedFirst) {
  let k = -1;
  if (undecidedFirst) for (let j = S.i + 1; j < S.rows.length; j++) if (!decOf(S.rows[j])) { k = j; break; }
  S.i = k >= 0 ? k : Math.min(S.i + 1, S.rows.length - 1);
  render(true);
}

function openFix() {
  const r = S.rows[S.i];
  $("fixbox").style.display = "block";
  $("fixText").value = field(r, "fixed", "text_tagged_fixed") || r.text_tagged;
  $("fixText").focus();
  $("fixText").onkeydown = e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); saveFix(); }
    if (e.key === "Escape") { e.preventDefault(); $("fixbox").style.display = "none"; }
  };
}

function saveFix() {
  const t = $("fixText").value.replace(/\s+/g, " ").trim(), err = tagError(t);
  if (!t || err) { $("fixerr").textContent = err || "text_tagged_fixed trống"; return; }
  decide("fix", { fixed: t });
}

function exportCSV() {
  if (!S.rows.length) return;
  const out = toCSV(S.header, S.rows.map(r => applyReview(r, S.rev[r.id])));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([out], { type: "text/csv;charset=utf-8" }));
  a.download = S.name || "review.csv";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

document.addEventListener("keydown", e => {
  if (!S.rows.length) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); exportCSV(); return; }
  if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) return;
  const r = S.rows[S.i], a = $("aud");
  // sửa mức Việt hoá tại chỗ (không vẽ lại trang, để audio đang phát không bị dừng)
  const setLv = lv => { setRev(r, { viet_levels: lv.join(",") }); $("fLv").value = lv.join(","); $("lvc").textContent = lv.length; };
  const curLv = () => field(r, "viet_levels").split(",").map(x => x.trim()).filter(Boolean);
  const addLv = v => setLv(curLv().concat([v]));
  switch (e.key) {
    case "1": decide("ok"); break;
    case "2": decide("drop"); break;
    case "3": e.preventDefault(); openFix(); break;
    case " ": e.preventDefault(); if (a) (a.paused ? a.play() : a.pause()); break;
    case "r": case "R": if (a) { a.currentTime = 0; a.play().catch(() => {}); } break;
    case "ArrowRight": S.i = Math.min(S.i + 1, S.rows.length - 1); render(true); break;
    case "ArrowLeft": S.i = Math.max(S.i - 1, 0); render(true); break;
    case "s": case "S": addLv("strong"); break;
    case "m": case "M": addLv("mid"); break;
    case "n": case "N": addLv("native"); break;
    case "Backspace": { e.preventDefault(); setLv(curLv().slice(0, -1)); break; }
    case "u": case "U": setRev(r, { decision: "" }); render(false); break;
  }
});
</script>
</body>
</html>
